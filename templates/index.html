<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMI Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 20px;
      box-sizing: border-box;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }
    @media (max-width: 480px) {
      body {
        margin: 20px auto;
        padding: 15px;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <h1>BMI Calculator</h1>
  <form action="/api/bmi" method="post" class="panel">
    <input type="number" step="0.01" placeholder="Weight (kg)" name="weight_kg" required>
    <input type="number" step="0.01" placeholder="Height (m)" name="height_m" required>
    <button type="submit">Calculate BMI</button>
  </form>
</body>
</html>
